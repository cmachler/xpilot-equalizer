name: Build MSI

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'installer/**'
      - 'scripts/build-msi.ps1'
      - 'src/**'
  workflow_dispatch:
    inputs:
      version:
        description: MSI version (X.Y.Z, no leading v)
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $v = '${{ inputs.version }}'
          if (-not $v) { $v = '${{ github.ref_name }}' }
          $v = $v -replace '^v', ''
          if (-not $v) { $v = '1.0.0' }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build MSI
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build-msi.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XpilotAudioEqualizer-msi
          path: dist/XpilotAudioEqualizer.msi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/XpilotAudioEqualizer.msi
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
